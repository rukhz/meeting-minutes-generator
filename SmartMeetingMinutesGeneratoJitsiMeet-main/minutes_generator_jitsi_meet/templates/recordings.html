<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recordings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .recordings-list {
            display: grid;
            gap: 15px;
        }

        .recording-item {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .recording-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .recording-info {
            flex: 1;
        }

        .recording-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .recording-meta {
            font-size: 14px;
            color: #666;
        }

        .recording-actions {
            display: flex;
            gap: 10px;
        }

        .btn-download {
            padding: 8px 16px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-download:hover {
            background: #229954;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📁 Saved Recordings</h1>
            <a href="/" class="btn">← Back to Home</a>
        </div>

        <div id="recordingsContainer">
            <div class="loading">Loading recordings...</div>
        </div>
    </div>

    <script>
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        async function loadRecordings() {
            try {
                const response = await fetch('/api/recordings');
                const data = await response.json();

                const container = document.getElementById('recordingsContainer');

                if (data.recordings && data.recordings.length > 0) {
                    container.innerHTML = `
                        <div class="recordings-list">
                            ${data.recordings.map(recording => `
                                <div class="recording-item">
                                    <div class="recording-info">
                                        <div class="recording-name">${recording.filename}</div>
                                        <div class="recording-meta">
                                            ${recording.date} • ${formatFileSize(recording.size)}
                                        </div>
                                    </div>
                                    <div class="recording-actions">
                                        <a href="/api/download/${recording.filename}" class="btn-download" download>
                                            Download
                                        </a>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                                <line x1="16" y1="13" x2="8" y2="13"></line>
                                <line x1="16" y1="17" x2="8" y2="17"></line>
                                <polyline points="10 9 9 9 8 9"></polyline>
                            </svg>
                            <h2>No recordings found</h2>
                            <p>Recordings will appear here after you record a meeting.</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading recordings:', error);
                document.getElementById('recordingsContainer').innerHTML = `
                    <div class="empty-state">
                        <p>Error loading recordings: ${error.message}</p>
                    </div>
                `;
            }
        }

        // Load recordings on page load
        loadRecordings();
    </script>
</body>
</html>
