<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jitsi Meet Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        
        .checkbox-group input {
            width: auto;
            margin: 0;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            flex: 1;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        .status-idle {
            background: #e0e0e0;
            color: #666;
        }
        
        .status-joined {
            background: #d4edda;
            color: #155724;
        }
        
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #667eea;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Jitsi Meet Bot</h1>
            <p>Automated meeting participant for Smart Meeting Minutes</p>
        </div>
        
        <div class="content">
            <div id="statusBadge" class="status-badge status-idle">● Idle</div>
            
            <form id="botForm">
                <div class="form-group">
                    <label for="room">Meeting Room Name:</label>
                    <input type="text" id="room" placeholder="e.g., my-meeting-room or meet.jit.si/my-meeting-room" required>
                </div>
                
                <div class="form-group">
                    <label for="bot_name">Bot Display Name:</label>
                    <input type="text" id="bot_name" placeholder="MeetingBot" value="MeetingBot">
                </div>
                
                <div class="form-group">
                    <label>Bot Settings:</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="audio_muted" disabled title="Fixed: bot listens for transcription">
                        <label for="audio_muted" style="margin:0; opacity:0.8;">Audio muted (listen only - for transcription)</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="video_muted" disabled title="Fixed: bot has no video">
                        <label for="video_muted" style="margin:0; opacity:0.8;">Video muted</label>
                    </div>
                    <small style="color:#666; font-size:12px;">Bot joins listen-only for transcription. Leave from Jitsi Meet's hangup button.</small>
                </div>
                
                <div class="btn-group">
                    <button type="submit" id="joinBtn">
                        <span class="loader" style="display: none;"></span>
                        <span>Join Meeting</span>
                    </button>
                </div>
            </form>
            
            <div id="alert" class="alert"></div>
        </div>
    </div>

    <script>
        const socket = io();
        
        function updateStatus(inMeeting) {
            const badge = document.getElementById('statusBadge');
            const joinBtn = document.getElementById('joinBtn');
            
            if (inMeeting) {
                badge.className = 'status-badge status-joined';
                badge.textContent = '● In Meeting';
                joinBtn.disabled = true;
            } else {
                badge.className = 'status-badge status-idle';
                badge.textContent = '● Idle';
                joinBtn.disabled = false;
            }
        }
        
        socket.on('bot_status', (data) => {
            const inMeeting = data.in_meeting ?? (data.status === 'joined');
            updateStatus(inMeeting);
            if (data.message) {
                showAlert(data.message, data.status === 'error' ? 'error' : 'success');
            }
        });
        
        document.getElementById('botForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const joinBtn = document.getElementById('joinBtn');
            const loader = joinBtn.querySelector('.loader');
            const btnText = joinBtn.querySelector('span:last-child');
            
            loader.style.display = 'inline-block';
            btnText.textContent = 'Joining...';
            joinBtn.disabled = true;
            
            const roomInput = document.getElementById('room').value.trim();
            const room = extractRoomName(roomInput);
            const botName = document.getElementById('bot_name').value.trim() || 'MeetingBot';
            // Fixed: both unchecked, not editable - bot listens for transcription
            const audioMuted = false;
            const videoMuted = false;
            
            try {
                const response = await fetch('/api/bot/join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        room,
                        display_name: botName,
                        audio_muted: audioMuted,
                        video_muted: videoMuted,
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert(data.message, 'success');
                } else {
                    showAlert(data.error || 'Failed to join', 'error');
                    joinBtn.disabled = false;
                }
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
                joinBtn.disabled = false;
            } finally {
                loader.style.display = 'none';
                btnText.textContent = 'Join Meeting';
            }
        });
        
        function extractRoomName(input) {
            if (!input) return 'MeetingRoom';
            try {
                const url = new URL(input.startsWith('http') ? input : 'https://meet.jit.si/' + input);
                const path = url.pathname.replace(/^\//, '');
                return path || input;
            } catch {
                return input.replace(/^https?:\/\/[^/]+\//, '').replace(/\/$/, '') || input;
            }
        }
        
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alert.style.display = 'block';
            setTimeout(() => { alert.style.display = 'none'; }, 5000);
        }
        
        fetch('/api/bot/status').then(r => r.json()).then(data => {
            updateStatus(data.in_meeting);
        }).catch(() => {});
    </script>
</body>
</html>
